<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>SocialFlow sem conexão</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0d0d0d; color: #fff; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #ffffff1f; border-radius: 24px; background: #ffffff0a; text-align: center; }
      img { width: 64px; height: 64px; margin-bottom: 20px; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0; color: #a1a1aa; line-height: 1.6; }
      button { margin-top: 24px; border: 0; border-radius: 14px; padding: 12px 18px; background: linear-gradient(90deg, #1d4ed8, #7e22ce); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Reconecte-se para carregar campanhas, avisos e atualizações do SocialFlow.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
